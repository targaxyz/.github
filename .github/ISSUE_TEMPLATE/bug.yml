name: Bug
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
  - type: input
    id: where
    attributes:
      label: Where
      description: Bot command, dashboard page, site URL, app screen, build or commit.
